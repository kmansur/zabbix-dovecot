name: Bug report
description: Report a reproducible problem in the Dovecot template or collector.
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Describe expected and observed behavior.
    validations:
      required: true
  - type: input
    id: zabbix
    attributes:
      label: Zabbix version/build
    validations:
      required: true
  - type: input
    id: dovecot
    attributes:
      label: Dovecot version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Remove credentials, public addresses, usernames and private hostnames.
